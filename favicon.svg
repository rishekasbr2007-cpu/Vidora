<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="lens" cx="40%" cy="40%" r="50%" fx="35%" fy="35%" gradientUnits="objectBoundingBox" id="lensGrad">
      <stop offset="0%" style="stop-color:#4a7fa5"/>
      <stop offset="40%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0a1520"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Camera body -->
  <rect x="12" y="28" width="58" height="40" rx="4" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <!-- Lens barrel -->
  <circle cx="38" cy="48" r="17" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>
  <circle cx="38" cy="48" r="14" fill="#111" stroke="#333" stroke-width="1"/>
  <circle cx="38" cy="48" r="10" fill="url(#lensGrad)" stroke="#222" stroke-width="0.5"/>
  <circle cx="38" cy="48" r="5" fill="#0a1a2a"/>
  <circle cx="35" cy="45" r="2" fill="rgba(255,255,255,0.15)"/>
  <!-- Viewfinder top -->
  <rect x="18" y="21" width="16" height="9" rx="2" fill="#222" stroke="#444" stroke-width="1"/>
  <!-- Film reels -->
  <circle cx="62" cy="36" r="6" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <circle cx="62" cy="36" r="3" fill="#333"/>
  <circle cx="74" cy="44" r="5" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <circle cx="74" cy="44" r="2.5" fill="#333"/>
  <!-- Film strip -->
  <path d="M68 38 Q72 40 74 44" stroke="#555" stroke-width="1.5" fill="none"/>
  <!-- Film perforations -->
  <rect x="13" y="31" width="3" height="4" rx="0.5" fill="#111"/>
  <rect x="13" y="39" width="3" height="4" rx="0.5" fill="#111"/>
  <rect x="13" y="47" width="3" height="4" rx="0.5" fill="#111"/>
  <rect x="13" y="55" width="3" height="4" rx="0.5" fill="#111"/>
  <!-- Flash/spark -->
  <circle cx="78" cy="62" r="4" fill="#FFD700" opacity="0.8"/>
  <line x1="78" y1="55" x2="78" y2="52" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="83" y1="57" x2="85" y2="55" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="73" y1="57" x2="71" y2="55" stroke="#FFD700" stroke-width="1.5"/>
  <!-- Text: C!ne -->
  <text x="50" y="92" font-family="Georgia, serif" font-size="14" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">C<tspan fill="#e55" font-style="italic">!</tspan>ne</text>
</svg>
